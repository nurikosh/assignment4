<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <form class="card">
          <h1 class="card-header h4">Book a train ticket</h1>
          <div class="card-body p-4 p-md-5">

            <div class="btn-group d-flex d-md-inline-flex mb-4" role="group" aria-label="Trip type">
              <input type="radio" class="btn-check" name="trip" id="oneWay" value="one-way" checked>
              <label class="btn btn-trip" for="oneWay">One way</label>
              <input type="radio" class="btn-check" name="trip" id="roundTrip" value="round-trip">
              <label class="btn btn-trip" for="roundTrip">Round trip</label>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="From" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="To" required>
                  <label for="to">To</label>
                </div>
              </div>

              <div class="col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers">
                  <option value="1">1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <fieldset class="col-12">
                <legend class="mb-2">Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                  <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe">
                  <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
                  <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
              </fieldset>

              <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel-national" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>
              </div>
            </div>

            <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-4">
              <button type="reset" class="btn btn-clear">Clear</button>
              <button type="submit" class="btn btn-find">Find trains</button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
